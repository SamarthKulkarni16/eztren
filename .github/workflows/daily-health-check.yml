name: Daily Health Check

on:
  schedule:
    # 8:45 AM IST = 3:15 AM UTC — runs 15 min before Make.com's 9:00 AM IST
    # scenario, so status.json is fresh by the time Make.com reads it.
    - cron: "15 3 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write # needed to commit status.json back to the repo

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run build
        id: build
        run: npm run build
        continue-on-error: true

      - name: Run lint
        id: lint
        run: npm run lint
        continue-on-error: true

      - name: Run health check script
        env:
          BUILD_STATUS: ${{ steps.build.outcome }}
          LINT_STATUS: ${{ steps.lint.outcome }}
        run: node scripts/health-check.mjs

      - name: Commit status.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json
          git diff --staged --quiet || git commit -m "chore: update health check status [skip ci]"
          git push
